<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Daftar Anggota</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Daftar Buku</a></li>
                <li><a href="../buku/tambah.html">Tambah Buku</a></li>
                <li><a href="list.html">Daftar Anggota</a></li>
                <li><a href="tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Anggota</h2>
            <div class="search-box">
                <label for="search-input">Cari Nama Anggota</label>
                <input type="text" id="search-input" placeholder="Ketik nama anggota..." data-kolom="1">
            </div>
            <p id="row-counter" class="row-counter" data-satuan="anggota"></p>
            <p id="loading-indicator" style="display:none;">Memuat data...</p>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th rowspan="2">No. Anggota</th>
                            <th rowspan="2">Nama</th>
                            <th rowspan="2">Alamat</th>
                            <th rowspan="2">No.HP</th>
                            <th colspan="2">Jenis Kelamin</th>
                            <th colspan="2">Aksi</th>
                        </tr>
                        <tr>
                            <th>Perempuan</th>
                            <th>Laki-Laki</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Baris diisi dinamis oleh assets/js/anggota.js via fetch -->
                    </tbody>
                </table>
            </div>
            
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/tabel.js"></script>
    <script src="../assets/js/anggota.js"></script>
</body>
</html>
